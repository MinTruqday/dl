name: Deploy Kubernetes

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-kubernetes
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  update-kubernetes:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubernetes Credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG"
          mkdir -p ~/.kube
          if printf '%s' "$KUBE_CONFIG" | base64 -d 2>/dev/null | grep -q 'apiVersion'; then
            printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          else
            printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: kubectl cluster-info

      - name: Lowercase repository
        run: |
          echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Prepare environment file
        env:
          DOCLIB_ENV: ${{ secrets.DOCLIB_ENV }}
        run: |
          test -n "$DOCLIB_ENV"
          printf '%s\n' "$DOCLIB_ENV" > ./k8s/.env

      - name: Validate deployment configuration
        run: |
          kubectl kustomize ./k8s > /tmp/doclib.yaml
          python scripts/audit_kubernetes.py /tmp/doclib.yaml

      - name: Update image registries in manifests
        run: |
          find ./k8s/apps -name "*.yaml" -exec sed -i "s|doclib-registry|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}|g; s|:latest|:${GITHUB_SHA}|g" {} +

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -k ./k8s/

      - name: Wait for rollout to complete
        run: |
          DEPLOYMENTS=$(kubectl get deployments -n doclib-production -o jsonpath='{.items[*].metadata.name}')
          read -ra DEPLOYMENT_NAMES <<< "$DEPLOYMENTS"
          for dep in "${DEPLOYMENT_NAMES[@]}"; do
            kubectl rollout status "deployment/$dep" -n doclib-production --timeout=300s
          done

      - name: Smoke test health endpoints
        shell: bash
        run: |
          declare -A SERVICE_PORTS
          SERVICE_PORTS=([authentication]=8000 [humanity]=8000 [content]=8000 [cloud]=8000 [drm]=8000 [compilation]=8000 [messaging]=8000 [notification]=8000 [collection]=8000 [finance]=8000 [usage]=8000 [management]=8000 [agentic-ai]=8000 [websocket]=8000 [worker-service]=8000)
          FAILED_SERVICES=()
          for svc in "${!SERVICE_PORTS[@]}"; do
            port="${SERVICE_PORTS[$svc]}"
            POD=$(kubectl get pods -n doclib-production -l "app=$svc" --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -z "$POD" ]; then
              echo "No running pod found for $svc"
              FAILED_SERVICES+=("$svc")
              continue
            fi
            if ! kubectl exec "$POD" -n doclib-production -- python -c "import urllib.request; urllib.request.urlopen('http://localhost:$port/health', timeout=10).read()" >/dev/null 2>&1; then
              echo "Health check failed for $svc (pod: $POD)"
              FAILED_SERVICES+=("$svc")
            else
              echo "$svc: OK"
            fi
          done
          if [ "${#FAILED_SERVICES[@]}" -gt 0 ]; then
            echo "Failed services: ${FAILED_SERVICES[*]}"
            exit 1
          fi
