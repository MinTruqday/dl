name: Deploy Kubernetes

on:
  workflow_dispatch:

concurrency:
  group: deploy-kubernetes
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  update-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubernetes Credentials
        run: |
          mkdir -p ~/.kube
          SECRET_VALUE="${{ secrets.KUBE_CONFIG }}"
          if echo "$SECRET_VALUE" | base64 -d 2>/dev/null | grep -q 'apiVersion'; then
            echo "$SECRET_VALUE" | base64 -d > ~/.kube/config
          else
            echo "$SECRET_VALUE" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: kubectl cluster-info

      - name: Lowercase repository
        run: |
          echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Prepare environment file
        run: |
          echo "${{ secrets.DOCLIB_ENV }}" > ./k8s/.env

      - name: Update image registries in manifests
        run: |
          find ./k8s/apps -name "*.yaml" -exec sed -i "s|doclib-registry|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}|g" {} +

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -k ./k8s/ --validate=false

      - name: Wait for rollout to complete
        run: |
          DEPLOYMENTS=$(kubectl get deployments -n doclib-production -o jsonpath='{.items[*].metadata.name}')
          for dep in $DEPLOYMENTS; do
            kubectl rollout status deployment/$dep -n doclib-production --timeout=300s
          done

      - name: Smoke test health endpoints
        shell: bash
        run: |
          declare -A SERVICE_PORTS
          SERVICE_PORTS=([authentication]=8001 [humanity]=8002 [content]=8004 [cloud]=8012 [drm]=8013 [compilation]=8011 [messaging]=8009 [notification]=8007 [collection]=8005 [finance]=8006 [usage]=8014 [management]=8003 [agentic-ai]=8008 [websocket]=8010)
          FAILED_SERVICES=()
          for svc in "${!SERVICE_PORTS[@]}"; do
            port="${SERVICE_PORTS[$svc]}"
            POD=$(kubectl get pods -n doclib-production -l app=$svc --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -z "$POD" ]; then
              echo "WARNING: No running pod found for $svc, skipping health check"
              FAILED_SERVICES+=("$svc")
              continue
            fi
            RESPONSE=$(kubectl exec "$POD" -n doclib-production -- curl -sf --max-time 10 http://localhost:$port/health 2>&1 || echo "failed")
            if echo "$RESPONSE" | grep -q "failed"; then
              echo "Health check failed for $svc (pod: $POD)"
              FAILED_SERVICES+=("$svc")
            else
              echo "$svc: OK"
            fi
          done
          if [ ${#FAILED_SERVICES[@]} -gt 0 ]; then
            echo "Failed services: ${FAILED_SERVICES[*]}"
            exit 1
          fi
