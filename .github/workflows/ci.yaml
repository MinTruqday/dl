name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check source policy
        run: python scripts/source_policy.py

      - name: Audit compilation components
        run: python scripts/audit_compilation_components.py

      - name: Audit microservice database boundaries
        run: python scripts/audit_service_boundaries.py

      - name: Audit container security contracts
        run: python scripts/audit_container_security.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check types
        run: pnpm --dir frontend exec tsc --noEmit

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Check generated files
        run: git diff --exit-code

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare validation environment
        run: |
          python - <<'PY' > k8s/.env
          import pathlib
          import re
          keys = set()
          for path in pathlib.Path("backend").glob("*/src/core/infrastructure/configuration.py"):
              keys.update(re.findall(r'os\.environ\["([A-Z0-9_]+)"\]', path.read_text()))
          for key in sorted(keys):
              print(f"{key}=validation")
          print("NEO4J_AUTH=validation/validation")
          PY

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > /tmp/doclib.yaml

      - name: Validate Kubernetes manifests
        run: python scripts/audit_kubernetes.py /tmp/doclib.yaml

  lint-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [agentic_ai, authentication, cloud, collection, compilation, content, drm, finance, humanity, management, messaging, notification, usage, websocket, worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: pip install ruff==0.9.10

      - name: Run Ruff lint check
        run: ruff check backend/${{ matrix.service }}/src/ --config ruff.toml

      - name: Compile Python sources
        run: python -m compileall -q backend/${{ matrix.service }}/src/

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan on repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: table
          exit-code: 1
          severity: CRITICAL
