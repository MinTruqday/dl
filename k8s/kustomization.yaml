namespace: doclib-production

resources:
  - namespace.yaml
  - configmap.yaml
  - infrastructure/mongodb.yaml
  - infrastructure/redis.yaml
  - infrastructure/rabbitmq.yaml
  - infrastructure/minio.yaml
  - infrastructure/qdrant.yaml
  - infrastructure/ollama.yaml
  - infrastructure/flaresolverr.yaml
  - observability/prometheus-config.yaml
  - observability/grafana-datasource.yaml
  - observability/grafana-dashboards.yaml
  - observability/prometheus.yaml
  - observability/grafana.yaml
  - apps/agentic_ai.yaml
  - apps/authentication.yaml
  - apps/humanity.yaml
  - apps/collection.yaml
  - apps/compilation.yaml
  - apps/messaging.yaml
  - apps/content.yaml
  - apps/drm.yaml
  - apps/finance.yaml
  - apps/management.yaml
  - apps/notification.yaml
  - apps/websocket.yaml
  - apps/worker.yaml
  - apps/cloud.yaml
  - apps/frontend.yaml
  - apps/usage.yaml
  - ingress/nginx-configmap.yaml
  - ingress/ingress.yaml

patches:
  - target:
      kind: Deployment
      name: ".*-deployment"
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true

secretGenerator:
  - name: doclib-secrets
    envs:
      - .env
