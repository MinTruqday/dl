  - apps/search.yaml
  - apps/drm.yaml
  - apps/finance.yaml
  - apps/management.yaml
  - apps/notification.yaml
  - apps/websocket.yaml
  - apps/worker.yaml
  - apps/cloud.yaml
  - apps/frontend.yaml
  - apps/usage.yaml
  - apps/rag.yaml
  - ingress/ingress.yaml

patches:
  - target:
      kind: Deployment
      name: ".*-deployment"
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true

