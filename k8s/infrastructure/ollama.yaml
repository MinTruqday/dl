apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: model-bootstrap
        image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
        command:
        - /bin/sh
        - -c
        - |-
          set -eu
          ollama serve &
          server_pid=$!
          until ollama list >/dev/null 2>&1
          do
            sleep 1
          done
          ollama pull "$LLM_MODEL"
          kill "$server_pid"
        envFrom:
        - configMapRef:
            name: doclib-config
        - secretRef:
            name: doclib-ollama-secrets
        env:
        - name: OLLAMA_HOST
          value: http://127.0.0.1:11434
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: ollama-data
          mountPath: /models
      containers:
      - name: ollama
        image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
        env:
        - name: OLLAMA_MODELS
          value: /models
        - name: OLLAMA_KEEP_ALIVE
          value: 2m
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /models
        readinessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 1000m
            memory: 8Gi
          limits:
            cpu: 4000m
            memory: 16Gi
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  ports:
  - port: 11434
  selector:
    app: ollama
