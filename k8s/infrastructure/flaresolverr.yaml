apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
        - name: LOG_LEVEL
          value: info
        - name: TZ
          value: Asia/Ho_Chi_Minh
        ports:
        - containerPort: 8191
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
spec:
  ports:
  - port: 8191
  selector:
    app: flaresolverr
