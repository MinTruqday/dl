apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-deployment
  namespace: doclib-production
  labels:
    app: workspace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
    spec:
      containers:
        - name: workspace
          image: doclib-registry/workspace:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: doclib-config
            - secretRef:
                name: doclib-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: workspace
  namespace: doclib-production
spec:
  selector:
    app: workspace
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
