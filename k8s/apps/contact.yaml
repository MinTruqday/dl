apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contact
  template:
    metadata:
      labels:
        app: contact
    spec:
      containers:
      - name: contact
        image: doclib-contact:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: doclib-env
        ports:
        - containerPort: 8100
---
apiVersion: v1
kind: Service
metadata:
  name: contact
spec:
  ports:
  - port: 8100
  selector:
    app: contact
