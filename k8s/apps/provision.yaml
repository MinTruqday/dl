apiVersion: apps/v1
kind: Deployment
metadata:
  name: provision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provision
  template:
    metadata:
      labels:
        app: provision
    spec:
      containers:
      - name: provision
        image: doclib-provision:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: doclib-env
        ports:
        - containerPort: 8050
---
apiVersion: v1
kind: Service
metadata:
  name: provision
spec:
  ports:
  - port: 8050
  selector:
    app: provision
