apiVersion: apps/v1
kind: Deployment
metadata:
  name: live_events-deployment
  namespace: doclib-production
  labels:
    app: live_events
spec:
  replicas: 3
  selector:
    matchLabels:
      app: live_events
  template:
    metadata:
      labels:
        app: live_events
    spec:
      containers:
        - name: live_events
          image: doclib-registry/live_events:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: doclib-config
            - secretRef:
                name: doclib-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: live_events
  namespace: doclib-production
spec:
  selector:
    app: live_events
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
