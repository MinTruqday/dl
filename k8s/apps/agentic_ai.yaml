apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ai-deployment
  namespace: doclib-production
  labels:
    app: agentic-ai-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agentic-ai-service
  template:
    metadata:
      labels:
        app: agentic-ai-service
    spec:
      containers:
        - name: agentic-ai-service
          image: doclib-registry/agentic_ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: doclib-config
            - secretRef:
                name: doclib-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-ai-service
  namespace: doclib-production
spec:
  selector:
    app: agentic-ai-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
