apiVersion: apps/v1
kind: Deployment
metadata:
  name: content
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content
  template:
    metadata:
      labels:
        app: content
    spec:
      containers:
      - name: content
        image: doclib-content:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: doclib-env
        ports:
        - containerPort: 8450
---
apiVersion: v1
kind: Service
metadata:
  name: content
spec:
  ports:
  - port: 8450
  selector:
    app: content
