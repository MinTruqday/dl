apiVersion: apps/v1
kind: Deployment
metadata:
  name: editor-deployment
  namespace: doclib-production
  labels:
    app: editor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: editor
  template:
    metadata:
      labels:
        app: editor
    spec:
      containers:
        - name: editor
          image: doclib-registry/editor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: doclib-config
            - secretRef:
                name: doclib-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: editor
  namespace: doclib-production
spec:
  selector:
    app: editor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
