apiVersion: apps/v1
kind: Deployment
metadata:
  name: doclib-content
  labels:
    app: doclib-content
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doclib-content
  template:
    metadata:
      labels:
        app: doclib-content
    spec:
      containers:
      - name: content
        image: doclib_content:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: doclib-config
---
apiVersion: v1
kind: Service
metadata:
  name: doclib-content
spec:
  selector:
    app: doclib-content
  ports:
    - protocol: TCP
      port: 8004
      targetPort: 8004
