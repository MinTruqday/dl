apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doclib-ingress
  namespace: doclib-production
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-brotli: "true"
    nginx.ingress.kubernetes.io/brotli-level: "6"
    nginx.ingress.kubernetes.io/brotli-types: "text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm"
spec:
  ingressClassName: nginx
  rules:
