apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doclib-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - path: /wallet(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: finance
            port:
              number: 8350
      - path: /notification(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: signal
            port:
              number: 8150
      - path: /inference(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: agentic_ai
            port:
              number: 8400
      - path: /collect(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: collector
            port:
              number: 8250
      - path: /compile(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: compiler
            port:
              number: 8300
      - path: /auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: authentication
            port:
              number: 8500
      - path: /user(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: provision
            port:
              number: 8050
      - path: /contact(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: contact
            port:
              number: 8100
      - path: /message(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: websocket
            port:
              number: 8200
      - path: /document(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: content
            port:
              number: 8450
      # Frontend default route
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend
            port:
              number: 3000
