apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doclib-ingress
  namespace: doclib-production
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - path: /wallet(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: finance-service
            port:
              number: 80
      - path: /notification(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: notification-service
            port:
              number: 80
      - path: /inference(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: agentic-ai-service
            port:
              number: 80
      - path: /collect(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: collector-service
            port:
              number: 80
      - path: /compile(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: editor-service
            port:
              number: 80
      - path: /auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: authentication-service
            port:
              number: 80
      - path: /user(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: management-service
            port:
              number: 80
      - path: /contact(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: messaging-service
            port:
              number: 80
      - path: /message(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: realtime-service
            port:
              number: 80
      - path: /document(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: content-service
            port:
              number: 80
      # Frontend default route
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend-service
            port:
              number: 80
