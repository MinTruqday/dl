services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: doclib_laresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - doclib_network

  mongodb:
    image: mongo:7.0
    container_name: doclib_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - doclib_network

  redis:
    image: redis:7-alpine
    container_name: doclib_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doclib_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: doclib_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - doclib_network

  minio:
    image: minio/minio:latest
    container_name: doclib_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - doclib_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doclib_backend
    restart: always
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
    volumes:
      - ./backend:/app
      - ./backend/public/uploads:/app/public/uploads
      - ./backend/public/feed_uploads:/app/public/feed_uploads
    networks:
      - doclib_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: doclib_frontend
    restart: always
    ports:
      - "3000:3000"
    working_dir: /app
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - SECRET_KEY=${SECRET_KEY}
      - RETURN_RESET_TOKEN_IN_RESPONSE=${RETURN_RESET_TOKEN_IN_RESPONSE}
      - MOMO_NOTIFY_URL=${MOMO_NOTIFY_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - backend
  agentic-rag:
    build:
      context: ./backend/agentic-rag
      dockerfile: Dockerfile
    container_name: doclib_agentic_rag
    restart: always
    ports:
      - "8100:8100"
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    networks:
      - doclib_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: doclib_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - doclib_network

  prometheus:
    image: prom/prometheus:latest
    container_name: doclib_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - doclib_network

  grafana:
    image: grafana/grafana:latest
    container_name: doclib_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - doclib_network

networks:
  doclib_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  hf_cache:
