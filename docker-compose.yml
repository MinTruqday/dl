services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: doclib_flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - doclib_network

  mongodb:
    image: mongo:7.0
    container_name: doclib_mongodb
    restart: always
    command: [ "--replSet", "rs0" ]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - doclib_network

  redis:
    image: redis:7-alpine
    container_name: doclib_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doclib_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: doclib_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - doclib_network

  minio:
    image: minio/minio:latest
    container_name: doclib_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - doclib_network

  traefik:
    image: traefik:latest
    container_name: doclib_traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8000"
    ports:
      - "8000:8000"
      - "8081:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - doclib_network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: deps
    container_name: doclib_frontend
    restart: always
    ports:
      - "3000:3000"
    working_dir: /app
    command: pnpm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./packages:/packages
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - SECRET_KEY=${SECRET_KEY}
      - RETURN_RESET_TOKEN_IN_RESPONSE=${RETURN_RESET_TOKEN_IN_RESPONSE}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}
      - PAYOS_API_KEY=${PAYOS_API_KEY}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}
      - PAYOS_RETURN_URL=${PAYOS_RETURN_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - DOCUMENTS_URL=${DOCUMENTS_URL}
      - BILLING_URL=${BILLING_URL}
      - ADMINISTRATION_URL=${ADMINISTRATION_URL}
      - INTELLIGENCE_URL=${INTELLIGENCE_URL}
      - ALERTS_URL=${ALERTS_URL}
      - IDENTITY_URL=${IDENTITY_URL}
      - CONVERSATIONS_URL=${CONVERSATIONS_URL}
      - INGESTION_URL=${INGESTION_URL}
      - WORKSPACE_URL=${WORKSPACE_URL}
      - LIVE_EVENTS_URL=${LIVE_EVENTS_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - traefik

  ollama:
    image: ollama/ollama:latest
    container_name: doclib_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - doclib_network

  payment:
    build:
      context: ./backend
      dockerfile: ./payment/Dockerfile
    container_name: doclib_payment
    restart: always
    ports:
      - "8350:8350"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance.rule=PathPrefix(`/rut-tien`) || PathPrefix(`/nap-tien`) || PathPrefix(`/kiem-tien`) || PathPrefix(`/ma-qua-tang`) || PathPrefix(`/vi-tien`)"
      - "traefik.http.services.finance.loadbalancer.server.port=8350"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_payment
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/payment/src:/app/src
      - ./backend/logs/finance:/app/logs
    networks:
      - doclib_network

  notification:
    build:
      context: ./backend
      dockerfile: ./notification/Dockerfile
    container_name: doclib_notification
    restart: always
    ports:
      - "8150:8150"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification.rule=PathPrefix(`/thong-bao`)"
      - "traefik.http.services.notification.loadbalancer.server.port=8150"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_notification
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/notification/src:/app/src
      - ./backend/logs/notification:/app/logs
    networks:
      - doclib_network

  agentic_ai:
    build:
      context: ./backend
      dockerfile: ./agentic_ai/Dockerfile
    container_name: doclib_agentic_ai
    restart: always
    ports:
      - "8400:8400"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/lich-su`) || PathPrefix(`/phan-hoi`) || PathPrefix(`/suy-luan`) || PathPrefix(`/nap-du-lieu`) || PathPrefix(`/tinh-chinh`) || PathPrefix(`/tro-chuyen`) || PathPrefix(`/phan-hoi`) || PathPrefix(`/huan-luyen`) || PathPrefix(`/lich-su`) || PathPrefix(`/suy-luan`) || PathPrefix(`/nhap-lieu`)"
      - "traefik.http.services.ai.loadbalancer.server.port=8400"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_agentic_ai
    depends_on:
      - redis
      - qdrant
      - ollama
    volumes:
      - ./backend/agentic_ai/src:/app/src
      - hf_cache:/home/appuser/.cache/huggingface
    networks:
      - doclib_network
    # Bỏ comment cụm dưới đây khi deploy lên Cloud/VPS có GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: doclib_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - doclib_network

  prometheus:
    image: prom/prometheus:latest
    container_name: doclib_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - doclib_network

  grafana:
    image: grafana/grafana:latest
    container_name: doclib_grafana
    user: root
    restart: always
    ports:
      - "3001:3000"
    environment:
      - SERVICE_DB_NAME=doclib_agentic_ai
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - doclib_network

  collection:
    build:
      context: ./backend
      dockerfile: ./collection/Dockerfile
    container_name: doclib_collection
    restart: always
    ports:
      - "8250:8250"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collector.rule=PathPrefix(`/thu-thap`)"
      - "traefik.http.services.collector.loadbalancer.server.port=8250"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_collection
    depends_on:
      - rabbitmq
      - mongodb
      - redis
      - minio
    volumes:
      - ./backend/collection/src:/app/src
      - ./backend/logs/collector:/app/logs
    networks:
      - doclib_network

  compilation:
    build:
      context: ./backend
      dockerfile: ./compilation/Dockerfile
    container_name: doclib_compilation
    restart: always
    ports:
      - "8300:8300"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.editor.rule=PathPrefix(`/trinh-soan-thao`)"
      - "traefik.http.services.editor.loadbalancer.server.port=8300"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_compilation
    depends_on:
      - rabbitmq
      - mongodb
      - redis
    volumes:
      - ./backend/compilation/src:/app/src
      - tectonic_cache:/home/doclibuser/.cache/Tectonic
    networks:
      - doclib_network

  authentication:
    build:
      context: ./backend
      dockerfile: ./authentication/Dockerfile
    container_name: doclib_authentication
    restart: always
    ports:
      - "8500:8500"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentication.rule=PathPrefix(`/xac-thuc`)"
      - "traefik.http.services.authentication.loadbalancer.server.port=8500"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_authentication
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      - ./backend/authentication/src:/app/src
      - ./backend/logs/authentication:/app/logs
    networks:
      - doclib_network

  management:
    build:
      context: ./backend
      dockerfile: ./management/Dockerfile
    container_name: doclib_management
    restart: always
    ports:
      - "8050:8050"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.management.rule=PathPrefix(`/giam-sat`) || PathPrefix(`/han-muc`) || PathPrefix(`/ho-so`) || PathPrefix(`/kiem-toan`) || PathPrefix(`/nguoi-dung`) || PathPrefix(`/quang-cao`) || PathPrefix(`/van-hanh`) || PathPrefix(`/kiem-toan`) || PathPrefix(`/quang-cao`) || PathPrefix(`/van-hanh`) || PathPrefix(`/do-luong`) || PathPrefix(`/nguoi-dung`) || PathPrefix(`/han-muc`)"
      - "traefik.http.services.management.loadbalancer.server.port=8050"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_management
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      - ./backend/management/src:/app/src
      - ./backend/logs/management:/app/logs
    networks:
      - doclib_network

  websocket:
    build:
      context: ./backend
      dockerfile: ./websocket/Dockerfile
    container_name: doclib_websocket
    restart: always
    ports:
      - "8200:8200"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.realtime.rule=PathPrefix(`/ws`)"
      - "traefik.http.services.realtime.loadbalancer.server.port=8200"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_websocket
    depends_on:
      - redis
    volumes:
      - ./backend/websocket/src:/app/src
      - ./backend/logs/realtime:/app/logs
    networks:
      - doclib_network

  message:
    build:
      context: ./backend
      dockerfile: ./message/Dockerfile
    container_name: doclib_message
    restart: always
    ports:
      - "8100:8100"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.messaging.rule=PathPrefix(`/tin-nhan`)"
      - "traefik.http.services.messaging.loadbalancer.server.port=8100"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_message
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      - ./backend/message/src:/app/src
      - ./backend/logs/messaging:/app/logs
    networks:
      - doclib_network

  content:
    build:
      context: ./backend
      dockerfile: ./content/Dockerfile
    container_name: doclib_content
    restart: always
    ports:
      - "8450:8450"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.content.rule=PathPrefix(`/ban-nhap`) || PathPrefix(`/cong-tac`) || PathPrefix(`/danh-dau`) || PathPrefix(`/danh-gia`) || PathPrefix(`/doc-hieu`) || PathPrefix(`/ghim`) || PathPrefix(`/ket-xuat`) || PathPrefix(`/kham-pha`) || PathPrefix(`/luu-tru`) || PathPrefix(`/phien-ban`) || PathPrefix(`/tai-len`) || PathPrefix(`/tai-lieu`) || PathPrefix(`/thu-vien`) || PathPrefix(`/xuat-ban`) || PathPrefix(`/danh-dau`) || PathPrefix(`/noi-bat`) || PathPrefix(`/danh-gia`) || PathPrefix(`/tai-len`) || PathPrefix(`/ket-xuat`) || PathPrefix(`/cam-quyen-nhap-lieu`) || PathPrefix(`/luu-tru`) || PathPrefix(`/thu-vien`) || PathPrefix(`/ghim-trang`) || PathPrefix(`/kham-pha`) || PathPrefix(`/cong-tac`) || PathPrefix(`/xuat-cam-quyen`) || PathPrefix(`/phien-lam-cam-quyen`) || PathPrefix(`/tai-lieu-hieu`)"
      - "traefik.http.services.content.loadbalancer.server.port=8450"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_content
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
    volumes:
      - ./backend/content/src:/app/src
      - ./backend/logs/content:/app/logs
    networks:
      - doclib_network

  drm:
    build:
      context: ./backend
      dockerfile: ./drm/Dockerfile
    container_name: doclib_drm
    restart: always
    ports:
      - "8600:8600"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drm.rule=PathPrefix(`/drm`)"
      - "traefik.http.services.drm.loadbalancer.server.port=8600"
    env_file:
      - .env
    environment:
      - SERVICE_DB_NAME=doclib_drm
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/drm/src:/app/src
      - ./backend/logs/drm:/app/logs
    networks:
      - doclib_network

networks:
  doclib_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  hf_cache:
  ollama_data:
  tectonic_cache:
