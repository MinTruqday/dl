  authentication:
    build:
      context: ./backend
      dockerfile: ./authentication/Dockerfile
    container_name: doclib_authentication
    restart: always
    env_file:
      - .env
    ports:
      - "8500:8500"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`) || PathPrefix(`/dinh-danh`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8500"
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      - ./backend/authentication/src:/app/src
      - ./backend/core:/app/core
      - ./backend/logs/auth:/app/logs
    networks:
      - doclib_network

  provision:
    build:
      context: ./backend
      dockerfile: ./provision/Dockerfile
    container_name: doclib_provision
    restart: always
    env_file:
      - .env
    ports:
      - "8050:8050"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.provision.rule=PathPrefix(`/user`) || PathPrefix(`/audit`) || PathPrefix(`/telemetry`) || PathPrefix(`/operation`) || PathPrefix(`/quota`)"
      - "traefik.http.services.provision.loadbalancer.server.port=8050"
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      - ./backend/provision/src:/app/src
      - ./backend/core:/app/core
      - ./backend/logs/provision:/app/logs
    networks:
      - doclib_network

