x-service-environment: &service-environment
  PYTHONDONTWRITEBYTECODE: "1"
  PROJECT_NAME: ${PROJECT_NAME:?PROJECT_NAME is required}
  VERSION: ${VERSION:?VERSION is required}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
  REDIS_URI: ${REDIS_URI:?REDIS_URI is required}
  PLATFORM_SYSTEM_ID: ${PLATFORM_SYSTEM_ID:?PLATFORM_SYSTEM_ID is required}
  INTERNAL_API_URL: ${INTERNAL_API_URL:?INTERNAL_API_URL is required}

x-minio-environment: &minio-environment
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:?MINIO_PRIVATE_BUCKET is required}
  MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:?MINIO_PUBLIC_BUCKET is required}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}
  MINIO_REGION: ${MINIO_REGION:?MINIO_REGION is required}

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=15)"]
  interval: 30s
  timeout: 20s
  start_period: 30s
  retries: 3

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    container_name: doclib_flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - doclib_network

  mongodb:
    image: mongo:7.0@sha256:35a5926f71f8b6cb19206bee928c5a85f241a8be99f20c81abe35ae78a73415d
    container_name: doclib_mongodb
    restart: always
    command:
      - --replSet
      - rs0
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db
    networks:
      - doclib_network

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: doclib_redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - doclib_network

  rabbitmq:
    image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: doclib_rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 20s
      start_period: 10s
      retries: 12
    networks:
      - doclib_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: doclib_minio
    restart: always
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - doclib_network

  traefik:
    image: traefik:v3.7.6@sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
    container_name: doclib_traefik
    restart: always
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8000
      - --ping=true
      - --ping.entrypoint=web
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/ping"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - doclib_network

  nginx:
    image: fholzer/nginx-brotli@sha256:e0aa855b74b7cdd0bb13a8cb1599e3af9b6210a98fb6234081b551899bfb924c
    container_name: doclib_nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - doclib_network
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 20s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: deps
    container_name: doclib_frontend
    restart: always
    ports:
      - 3000:3000
    working_dir: /app
    command: pnpm dev --turbo --hostname 0.0.0.0 -p 3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./packages:/packages
      - frontend_next_cache:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3
    depends_on:
      - traefik
    networks:
      - doclib_network

  notification:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./notification/Dockerfile
    container_name: doclib_notification
    restart: always
    ports:
      - 8004:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.notification.rule=PathPrefix(`/thong-bao`)
      - traefik.http.services.notification.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:?NOTIFICATION_DB_NAME is required}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/notification/src:/app/src
      - ./backend/logs/notification:/app/logs
    networks:
      - doclib_network

  agentic_ai:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=15)"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3
    build:
      context: ./backend
      dockerfile: ./agentic_ai/Dockerfile
    container_name: doclib_agentic_ai
    restart: always
    ports:
      - 8015:8000
      - 38470-38479:38470-38479
    labels:
      - traefik.enable=true
      - traefik.http.routers.ai.rule=PathPrefix(`/lich-su`) || PathPrefix(`/phan-hoi`) || PathPrefix(`/suy-luan`) || PathPrefix(`/nap-du-lieu`) || PathPrefix(`/tro-chuyen`) || PathPrefix(`/huan-luyen`) || PathPrefix(`/nhap-lieu`) || PathPrefix(`/su-kien`) || PathPrefix(`/tiep-nap`) || PathPrefix(`/ngat-qua-trinh`) || PathPrefix(`/mcp`)
      - traefik.http.services.ai.loadbalancer.server.port=8000
    environment:
      <<: [*service-environment, *minio-environment]
      AGENTIC_AI_DB_NAME: ${AGENTIC_AI_DB_NAME:?AGENTIC_AI_DB_NAME is required}
      RABBITMQ_URI: ${RABBITMQ_URI:?RABBITMQ_URI is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      DOCKER_HOST: ${DOCKER_HOST:?DOCKER_HOST is required}
      MIN_FILE_SIZE_BYTES: ${MIN_FILE_SIZE_BYTES:?MIN_FILE_SIZE_BYTES is required}
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      PRIMARY_MODEL_STYLE: ${PRIMARY_MODEL_STYLE:?PRIMARY_MODEL_STYLE is required}
      PRIMARY_MODEL_URL: ${PRIMARY_MODEL_URL:?PRIMARY_MODEL_URL is required}
      PRIMARY_MODEL_HEALTH_URL: ${PRIMARY_MODEL_HEALTH_URL:?PRIMARY_MODEL_HEALTH_URL is required}
      PRIMARY_MODEL_API_TOKEN: ${PRIMARY_MODEL_API_TOKEN}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:?MODEL_TIMEOUT_SECONDS is required}
      MODEL_KEEP_ALIVE: ${MODEL_KEEP_ALIVE:-30m}
      RERANKER_MODEL: ${RERANKER_MODEL:?RERANKER_MODEL is required}
      NLLB_MODEL: ${NLLB_MODEL:?NLLB_MODEL is required}
      NLI_MODEL_NAME: ${NLI_MODEL_NAME:?NLI_MODEL_NAME is required}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?TAVILY_API_KEY is required}
      AGENT_SLOW_DURATION_MS_THRESHOLD: ${AGENT_SLOW_DURATION_MS_THRESHOLD:?AGENT_SLOW_DURATION_MS_THRESHOLD is required}
      AGENT_ROUTE_CONFIDENCE_THRESHOLD: ${AGENT_ROUTE_CONFIDENCE_THRESHOLD:?AGENT_ROUTE_CONFIDENCE_THRESHOLD is required}
      AGENT_EXECUTION_TIMEOUT_SECONDS: ${AGENT_EXECUTION_TIMEOUT_SECONDS:?AGENT_EXECUTION_TIMEOUT_SECONDS is required}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:?AGENT_RECURSION_LIMIT is required}
      AGENT_MAX_CONTEXT_TOKENS: ${AGENT_MAX_CONTEXT_TOKENS:?AGENT_MAX_CONTEXT_TOKENS is required}
      AGENT_HISTORY_MAX_TURNS: ${AGENT_HISTORY_MAX_TURNS:?AGENT_HISTORY_MAX_TURNS is required}
      AGENT_DEFAULT_MAX_OUTPUT_TOKENS: ${AGENT_DEFAULT_MAX_OUTPUT_TOKENS:?AGENT_DEFAULT_MAX_OUTPUT_TOKENS is required}
      AGENT_FILE_ROOT: ${AGENT_FILE_ROOT:?AGENT_FILE_ROOT is required}
      AGENT_ARCHIVE_MAX_FILES: ${AGENT_ARCHIVE_MAX_FILES:?AGENT_ARCHIVE_MAX_FILES is required}
      AGENT_ARCHIVE_MAX_UNCOMPRESSED_BYTES: ${AGENT_ARCHIVE_MAX_UNCOMPRESSED_BYTES:?AGENT_ARCHIVE_MAX_UNCOMPRESSED_BYTES is required}
      AGENT_ARCHIVE_MAX_COMPRESSION_RATIO: ${AGENT_ARCHIVE_MAX_COMPRESSION_RATIO:?AGENT_ARCHIVE_MAX_COMPRESSION_RATIO is required}
      MCP_ALLOWED_STDIO_COMMANDS: ${MCP_ALLOWED_STDIO_COMMANDS}
      MCP_ALLOWED_REMOTE_HOSTS: ${MCP_ALLOWED_REMOTE_HOSTS}
      MCP_ALLOW_PRIVATE_NETWORKS: ${MCP_ALLOW_PRIVATE_NETWORKS:?MCP_ALLOW_PRIVATE_NETWORKS is required}
      MCP_PRESET_ROOT: /opt/doclib-mcp
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-DocLib}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      rag:
        condition: service_started
      ollama:
        condition: service_healthy
    volumes:
      - ./backend/agentic_ai/src:/app/src
      - ./backend/agentic_ai/tests:/app/tests
      - hf_cache:/home/appuser/.cache/huggingface
    networks:
      - doclib_network

  finetune:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./finetune/Dockerfile
    container_name: doclib_finetune
    restart: always
    ports:
      - 8013:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.finetune.rule=PathPrefix(`/tinh-chinh`)
      - traefik.http.services.finetune.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      AGENTIC_AI_DB_NAME: ${AGENTIC_AI_DB_NAME:?AGENTIC_AI_DB_NAME is required}
      CONTENT_URL: http://content:8000
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required}
      FINETUNE_MODELS_DIR: /var/lib/doclib/finetune/models
      FINETUNE_ADAPTERS_DIR: /var/lib/doclib/finetune/adapters
      FINETUNE_GGUF_DIR: /var/lib/doclib/finetune/gguf
      FINETUNE_BASE_MODEL: ${FINETUNE_BASE_MODEL:-google/gemma-4-E4B-it}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      content:
        condition: service_started
      ollama:
        condition: service_healthy
    volumes:
      - ./backend/finetune/src:/app/src
      - ./backend/finetune/tests:/app/tests
      - hf_cache:/home/appuser/.cache/huggingface
      - finetune_data:/var/lib/doclib/finetune
    networks:
      - doclib_network

  ollama:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    container_name: doclib_ollama
    restart: unless-stopped
    ports:
      - 127.0.0.1:11434:11434
    environment:
      OLLAMA_KEEP_ALIVE: ${MODEL_KEEP_ALIVE:-24h}
      OLLAMA_LOAD_TIMEOUT: 15m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "1024"
      OLLAMA_MODELS: /models
    volumes:
      - ollama_data:/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 20s
      retries: 12
    networks:
      - doclib_network

  ollama_models:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
    entrypoint: ["/bin/sh", "/bootstrap_ollama.sh"]
    volumes:
      - ./scripts/bootstrap_ollama.sh:/bootstrap_ollama.sh:ro
      - ollama_data:/models
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - doclib_network
  qdrant:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: doclib_qdrant
    restart: always
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - doclib_network

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    container_name: doclib_prometheus
    restart: always
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - doclib_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 20s
      retries: 3

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: doclib_grafana
    restart: always
    ports:
      - 127.0.0.1:3001:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - doclib_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  collection:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./collection/Dockerfile
    container_name: doclib_collection
    restart: always
    ports:
      - 8012:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.collector.rule=PathPrefix(`/thu-thap`)
      - traefik.http.services.collector.loadbalancer.server.port=8000
    environment:
      <<: [*service-environment, *minio-environment]
      COLLECTION_DB_NAME: ${COLLECTION_DB_NAME:?COLLECTION_DB_NAME is required}
      RABBITMQ_URI: ${RABBITMQ_URI:?RABBITMQ_URI is required}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:?FLARESOLVERR_URL is required}
      MAX_DOWNLOAD_SIZE_BYTES: ${MAX_DOWNLOAD_SIZE_BYTES:?MAX_DOWNLOAD_SIZE_BYTES is required}
      MIN_FILE_SIZE_BYTES: ${MIN_FILE_SIZE_BYTES:?MIN_FILE_SIZE_BYTES is required}
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
    volumes:
      - ./backend/collection/src:/app/src
      - ./backend/logs/collector:/app/logs
    networks:
      - doclib_network

  compilation:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./compilation/Dockerfile
    container_name: doclib_compilation
    restart: always
    ports:
      - 8011:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.editor.rule=PathPrefix(`/soan-thao`)
      - traefik.http.services.editor.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      COMPILATION_DB_NAME: ${COMPILATION_DB_NAME:?COMPILATION_DB_NAME is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}
      MAX_COMPILE_INPUT_BYTES: ${MAX_COMPILE_INPUT_BYTES:?MAX_COMPILE_INPUT_BYTES is required}
      MAX_COMPILE_OUTPUT_BYTES: ${MAX_COMPILE_OUTPUT_BYTES:?MAX_COMPILE_OUTPUT_BYTES is required}
      MAX_CONCURRENT_COMPILATIONS: ${MAX_CONCURRENT_COMPILATIONS:?MAX_CONCURRENT_COMPILATIONS is required}
    depends_on:
      - mongodb
      - redis
      - minio
    volumes:
      - ./backend/compilation/src:/app/src
      - tectonic_cache_v2:/home/doclibuser/.cache/Tectonic
    networks:
      - doclib_network

  authentication:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./authentication/Dockerfile
    container_name: doclib_authentication
    restart: always
    ports:
      - 8007:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentication.rule=PathPrefix(`/xac-thuc`) || PathPrefix(`/google`)
      - traefik.http.services.authentication.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      AUTHENTICATION_DB_NAME: ${AUTHENTICATION_DB_NAME:?AUTHENTICATION_DB_NAME is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is required}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:?REFRESH_TOKEN_EXPIRE_DAYS is required}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL:?GOOGLE_AUTH_URL is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI is required}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:?GOOGLE_TOKEN_URL is required}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL:?GOOGLE_USERINFO_URL is required}
      PASSKEY_ALLOWED_ORIGINS: ${PASSKEY_ALLOWED_ORIGINS:?PASSKEY_ALLOWED_ORIGINS is required}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:?PASSKEY_RP_ID is required}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:?PASSKEY_RP_NAME is required}
      SENDER_EMAIL: ${SENDER_EMAIL:?SENDER_EMAIL is required}
      SENDER_NAME: ${SENDER_NAME:?SENDER_NAME is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/authentication/src:/app/src
      - ./backend/logs/authentication:/app/logs
    networks:
      - doclib_network
  humanity:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./humanity/Dockerfile
    container_name: doclib_humanity
    restart: always
    ports:
      - 8003:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.humanity.rule=PathPrefix(`/ho-so`) || PathPrefix(`/nguoi-dung`)
      - traefik.http.services.humanity.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      HUMANITY_DB_NAME: ${HUMANITY_DB_NAME:?HUMANITY_DB_NAME is required}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/humanity/src:/app/src
      - ./backend/logs/humanity:/app/logs
    networks:
      - doclib_network

  websocket:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./websocket/Dockerfile
    container_name: doclib_websocket
    restart: always
    ports:
      - 8005:8000
    labels:
      - traefik.enable=true
