  content:
    build:
      context: ./backend
      dockerfile: content/Dockerfile
    container_name: doclib_content
    restart: always
    ports:
      - "8450:8450"
    volumes:
      - ./backend/content/src:/app/src
      - ./backend/core:/app/core
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
    networks:
      - doclib_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.content.rule=PathPrefix(`/document`) || PathPrefix(`/review`) || PathPrefix(`/version`) || PathPrefix(`/reading`) || PathPrefix(`/bookmark`) || PathPrefix(`/library`) || PathPrefix(`/upload`) || PathPrefix(`/discovery`) || PathPrefix(`/export`) || PathPrefix(`/collaboration`) || PathPrefix(`/publication`) || PathPrefix(`/storage`) || PathPrefix(`/highlight`) || PathPrefix(`/editor`) || PathPrefix(`/draft`) || PathPrefix(`/highlight`) || PathPrefix(`/quota`)"
      - "traefik.http.services.content.loadbalancer.server.port=8450"

networks:
  doclib_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  hf_cache:
  ollama_data:
  tectonic_cache:

