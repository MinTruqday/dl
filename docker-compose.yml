services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    container_name: doclib_flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - doclib_network

  mongodb:
    image: mongo:7.0@sha256:35a5926f71f8b6cb19206bee928c5a85f241a8be99f20c81abe35ae78a73415d
    container_name: doclib_mongodb
    restart: always
    command:
      - --replSet
      - rs0
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db
    networks:
      - doclib_network

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: doclib_redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - doclib_network

  rabbitmq:
    image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: doclib_rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    networks:
      - doclib_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: doclib_minio
    restart: always
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - doclib_network

  traefik:
    image: traefik:v3.7.6@sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
    container_name: doclib_traefik
    restart: always
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8000
      - --ping=true
      - --ping.entrypoint=web
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - doclib_network

  nginx:
    image: fholzer/nginx-brotli@sha256:e0aa855b74b7cdd0bb13a8cb1599e3af9b6210a98fb6234081b551899bfb924c
    container_name: doclib_nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - doclib_network
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: deps
    container_name: doclib_frontend
    restart: always
    ports:
      - 3000:3000
    working_dir: /app
    command: pnpm exec next dev --hostname 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./packages:/packages
      - frontend_next_cache:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      - traefik
    networks:
      - doclib_network

  finance:
    build:
      context: ./backend
      dockerfile: ./finance/Dockerfile
    container_name: doclib_finance
    restart: always
    ports:
      - 8006:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.finance.rule=PathPrefix(`/rut-tien`) || PathPrefix(`/nap-tien`) || PathPrefix(`/kiem-tien`) || PathPrefix(`/vi-tien`)
      - traefik.http.services.finance.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/finance/src:/app/src
      - ./backend/logs/finance:/app/logs
    networks:
      - doclib_network

  notification:
    build:
      context: ./backend
      dockerfile: ./notification/Dockerfile
    container_name: doclib_notification
    restart: always
    ports:
      - 8007:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.notification.rule=PathPrefix(`/thong-bao`)
      - traefik.http.services.notification.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      - ./backend/notification/src:/app/src
      - ./backend/logs/notification:/app/logs
    networks:
      - doclib_network

  agentic_ai:
    build:
      context: ./backend
      dockerfile: ./agentic_ai/Dockerfile
    container_name: doclib_agentic_ai
    restart: always
    ports:
      - 8008:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.ai.rule=PathPrefix(`/lich-su`) || PathPrefix(`/phan-hoi`) || PathPrefix(`/suy-luan`) || PathPrefix(`/nap-du-lieu`) || PathPrefix(`/tinh-chinh`) || PathPrefix(`/tro-chuyen`) || PathPrefix(`/huan-luyen`) || PathPrefix(`/nhap-lieu`) || PathPrefix(`/su-kien`) || PathPrefix(`/toi-uu`) || PathPrefix(`/tiep-nap`) || PathPrefix(`/drm`) || PathPrefix(`/mcp`)
      - traefik.http.services.ai.loadbalancer.server.port=8000
    env_file:
      - .env
    environment:
      FINETUNE_MODELS_DIR: /var/lib/doclib/finetune/models
      FINETUNE_ADAPTERS_DIR: /var/lib/doclib/finetune/adapters
      FINETUNE_GGUF_DIR: /var/lib/doclib/finetune/gguf
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
      - qdrant
      - ollama_models
    volumes:
      - ./backend/agentic_ai/src:/app/src
      - ./backend/agentic_ai/tests:/app/tests
      - hf_cache:/home/appuser/.cache/huggingface
      - finetune_data:/var/lib/doclib/finetune
    networks:
      - doclib_network

  ollama:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    container_name: doclib_ollama
    restart: unless-stopped
    ports:
      - 127.0.0.1:11434:11434
    environment:
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MODELS: /models
    volumes:
      - ollama_data:/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - doclib_network

  ollama_models:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    restart: "no"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "/bootstrap_ollama.sh"]
    volumes:
      - ./scripts/bootstrap_ollama.sh:/bootstrap_ollama.sh:ro
      - ollama_data:/models
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - doclib_network
  qdrant:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: doclib_qdrant
    restart: always
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - doclib_network

  neo4j:
    image: neo4j:5-community@sha256:d9dd3dc7d1c78fa959191ff02dbdcbefadceaf83eee23428fb92a58cac8ad3fe
    container_name: doclib_neo4j
    restart: unless-stopped
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
    networks:
      - doclib_network

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    container_name: doclib_prometheus
    restart: always
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - doclib_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: doclib_grafana
    restart: always
    ports:
      - 127.0.0.1:3001:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - doclib_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  collection:
    build:
      context: ./backend
      dockerfile: ./collection/Dockerfile
    container_name: doclib_collection
    restart: always
    ports:
      - 8005:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.collector.rule=PathPrefix(`/thu-thap`)
      - traefik.http.services.collector.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
    volumes:
      - ./backend/collection/src:/app/src
      - ./backend/logs/collector:/app/logs
    networks:
      - doclib_network

  compilation:
    build:
      context: ./backend
      dockerfile: ./compilation/Dockerfile
    container_name: doclib_compilation
    restart: always
    ports:
      - 8011:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.editor.rule=PathPrefix(`/soan-thao`)
      - traefik.http.services.editor.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - minio
    volumes:
      - ./backend/compilation/src:/app/src
      - tectonic_cache_v2:/home/doclibuser/.cache/Tectonic
    networks:
      - doclib_network

  authentication:
    build:
      context: ./backend
      dockerfile: ./authentication/Dockerfile
    container_name: doclib_authentication
    restart: always
    ports:
      - 8001:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentication.rule=PathPrefix(`/xac-thuc`) || PathPrefix(`/google`)
      - traefik.http.services.authentication.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/authentication/src:/app/src
      - ./backend/logs/authentication:/app/logs
    networks:
      - doclib_network
  humanity:
    build:
      context: ./backend
      dockerfile: ./humanity/Dockerfile
    container_name: doclib_humanity
    restart: always
    ports:
      - 8002:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.humanity.rule=PathPrefix(`/ho-so`) || PathPrefix(`/nguoi-dung`)
      - traefik.http.services.humanity.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/humanity/src:/app/src
      - ./backend/logs/humanity:/app/logs
    networks:
      - doclib_network

  usage:
    build:
      context: ./backend
      dockerfile: ./usage/Dockerfile
    container_name: doclib_usage
    restart: always
    ports:
      - 8014:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.usage.rule=PathPrefix(`/goi-cuoc`) || PathPrefix(`/han-muc`)
      - traefik.http.services.usage.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/usage/src:/app/src
      - ./backend/logs/usage:/app/logs
    networks:
      - doclib_network

  management:
    build:
      context: ./backend
      dockerfile: ./management/Dockerfile
    container_name: doclib_management
    restart: always
    ports:
      - 8003:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.management.rule=PathPrefix(`/giam-sat`) || PathPrefix(`/kiem-toan`) || PathPrefix(`/quang-cao`) || PathPrefix(`/van-hanh`) || PathPrefix(`/do-luong`) || PathPrefix(`/phan-tich`)
      - traefik.http.services.management.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - minio
    volumes:
      - ./backend/management/src:/app/src
      - ./backend/logs/management:/app/logs
    networks:
      - doclib_network

  websocket:
    build:
      context: ./backend
      dockerfile: ./websocket/Dockerfile
    container_name: doclib_websocket
    restart: always
    ports:
      - 8010:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.realtime.rule=PathPrefix(`/ws`)
      - traefik.http.services.realtime.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/websocket/src:/app/src
      - ./backend/logs/realtime:/app/logs
    networks:
      - doclib_network

  messaging:
    build:
      context: ./backend
      dockerfile: ./messaging/Dockerfile
    container_name: doclib_messaging
    restart: always
    ports:
      - 8009:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.messaging.rule=PathPrefix(`/tin-nhan`)
      - traefik.http.services.messaging.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/messaging/src:/app/src
      - ./backend/logs/messaging:/app/logs
    networks:
      - doclib_network

  content:
    build:
      context: ./backend
      dockerfile: ./content/Dockerfile
    container_name: doclib_content
    restart: always
    ports:
      - 8004:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.content.rule=PathPrefix(`/cong-tac`)
        || PathPrefix(`/dau-trang`) || PathPrefix(`/danh-gia`) || PathPrefix(`/doc-hieu`)
        || PathPrefix(`/ghim`) || PathPrefix(`/kham-pha`)
        || PathPrefix(`/phien-ban`) || PathPrefix(`/tai-lieu`) || PathPrefix(`/thu-vien`)
        || PathPrefix(`/xuat-ban`) || PathPrefix(`/danh-dau`) || PathPrefix(`/noi-bat`)
        || PathPrefix(`/danh-gia`) || PathPrefix(`/cam-quyen-nhap-lieu`)
        || PathPrefix(`/thu-vien`) || PathPrefix(`/ghim-trang`) || PathPrefix(`/kham-pha`)
        || PathPrefix(`/cong-tac`) || PathPrefix(`/xuat-cam-quyen`) || PathPrefix(`/phien-lam-cam-quyen`)
        || PathPrefix(`/tai-lieu-hieu`)
      - traefik.http.services.content.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - minio
      - rabbitmq
    volumes:
      - ./backend/content/src:/app/src
      - ./backend/logs/content:/app/logs
    networks:
      - doclib_network

  cloud:
    build:
      context: ./backend
      dockerfile: ./cloud/Dockerfile
    container_name: doclib_cloud
    restart: always
    ports:
      - 8012:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.cloud.rule=PathPrefix(`/luu-tru`) || PathPrefix(`/tai-len`)
      - traefik.http.services.cloud.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - minio
    volumes:
      - ./backend/cloud/src:/app/src
      - ./backend/logs/cloud:/app/logs
    networks:
      - doclib_network

  drm:
    build:
      context: ./backend
      dockerfile: ./drm/Dockerfile
    container_name: doclib_drm
    restart: always
    ports:
      - 8013:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.drm.rule=PathPrefix(`/thuy-an`) || PathPrefix(`/ban-quyen`) || PathPrefix(`/giay-phep`) || PathPrefix(`/bao-ve`)
      - traefik.http.routers.drm.priority=2
      - traefik.http.services.drm.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/drm/src:/app/src
      - ./backend/logs/drm:/app/logs
    networks:
      - doclib_network

  worker:
    build:
      context: ./backend
      dockerfile: ./worker/Dockerfile
    container_name: doclib_worker
    restart: always
    ports:
      - 8015:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.worker.rule=PathPrefix(`/worker`)
      - traefik.http.services.worker.loadbalancer.server.port=8000
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend/worker/src:/app/src
      - tectonic_cache_v2:/home/appuser/.cache/Tectonic
    networks:
      - doclib_network

networks:
  doclib_network:
    driver: bridge

volumes:
  mongodb_data: null
  redis_data: null
  rabbitmq_data: null
  minio_data: null
  qdrant_data: null
  neo4j_data: null
  prometheus_data: null
  grafana_data: null
  hf_cache: null
  finetune_data: null
  tectonic_cache_v2: null
  frontend_node_modules: null
  frontend_next_cache: null
  ollama_data: null
