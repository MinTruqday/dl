services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: doclib_flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - doclib_network

  mongodb:
    image: mongo:7.0
    container_name: doclib_mongodb
    restart: always
    command: [ "--replSet", "rs0" ]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - doclib_network

  redis:
    image: redis:7-alpine
    container_name: doclib_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doclib_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: doclib_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - doclib_network

  minio:
    image: minio/minio:latest
    container_name: doclib_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - doclib_network

  traefik:
    image: traefik:latest
    container_name: doclib_traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8000"
    ports:
      - "8000:8000"
      - "8081:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - doclib_network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: deps
    container_name: doclib_frontend
    restart: always
    ports:
      - "3000:3000"
    working_dir: /app
    command: pnpm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./packages:/packages
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - SECRET_KEY=${SECRET_KEY}
      - RETURN_RESET_TOKEN_IN_RESPONSE=${RETURN_RESET_TOKEN_IN_RESPONSE}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}
      - PAYOS_API_KEY=${PAYOS_API_KEY}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}
      - PAYOS_RETURN_URL=${PAYOS_RETURN_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - traefik

  ollama:
    image: ollama/ollama:latest
    container_name: doclib_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - doclib_network

  finance:
    build:
      context: ./backend
      dockerfile: ./finance/Dockerfile
    container_name: doclib_finance
    restart: always
    ports:
      - "8350:8350"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance.rule=PathPrefix(`/wallet`) || PathPrefix(`/deposit`) || PathPrefix(`/withdrawal`) || PathPrefix(`/coupon`)"
      - "traefik.http.services.finance.loadbalancer.server.port=8350"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/finance/src:/app/src
      - ./backend/core:/app/core
      - ./backend/logs/finance:/app/logs
    networks:
      - doclib_network

  signal:
    build:
      context: ./backend
      dockerfile: ./signal/Dockerfile
    container_name: doclib_signal
    restart: always
    ports:
      - "8150:8150"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.signal.rule=PathPrefix(`/notification`)"
      - "traefik.http.services.signal.loadbalancer.server.port=8150"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/signal/src:/app/src
      - ./backend/core:/app/core
      - ./backend/logs/signal:/app/logs
    networks:
      - doclib_network

  agentic_ai:
    build:
      context: ./backend
      dockerfile: ./agentic_ai/Dockerfile
    container_name: doclib_agentic_ai
    restart: always
    ports:
      - "8400:8400"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/inference`) || PathPrefix(`/chat`) || PathPrefix(`/ingest`) || PathPrefix(`/feedback`) || PathPrefix(`/finetune`) || PathPrefix(`/history`)"
      - "traefik.http.services.ai.loadbalancer.server.port=8400"
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
      - ollama
    volumes:
      - ./backend/agentic_ai/src:/app/src
      - ./backend/core:/app/core
      - hf_cache:/home/appuser/.cache/huggingface
    networks:
      - doclib_network
    # Bỏ comment cụm dưới đây khi deploy lên Cloud/VPS có GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: doclib_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - doclib_network

  prometheus:
    image: prom/prometheus:latest
    container_name: doclib_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - doclib_network

  grafana:
    image: grafana/grafana:latest
    container_name: doclib_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - doclib_network

  collector:
    build:
      context: ./backend
      dockerfile: ./collector/Dockerfile
    container_name: doclib_collector
    restart: always
    env_file:
      - .env
    ports:
      - "8250:8250"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collector.rule=PathPrefix(`/collect`)"
      - "traefik.http.services.collector.loadbalancer.server.port=8250"
    depends_on:
      - rabbitmq
      - mongodb
      - redis
      - minio
    volumes:
      - ./backend/collector/src:/app/src
      - ./backend/core:/app/core
      - ./backend/logs/collector:/app/logs
    command: bash -c "uvicorn src.main:app --host 0.0.0.0 --port 8250 > /app/logs/collector_startup.log 2>&1"
    networks:
      - doclib_network

  compiler:
    build:
      context: ./backend
      dockerfile: ./compiler/Dockerfile
    container_name: doclib_compiler
    restart: always
    env_file:
      - .env
    ports:
      - "8300:8300"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compiler.rule=PathPrefix(`/compile`)"
      - "traefik.http.services.compiler.loadbalancer.server.port=8300"
    depends_on:
      - rabbitmq
      - mongodb
      - redis
    volumes:
      - ./backend/compiler/src:/app/src
      - ./backend/core:/app/core
      - tectonic_cache:/home/doclibuser/.cache/Tectonic
    networks:
      - doclib_network

