name: veriq

services:
  mongodb:
    # The existing local volume uses MongoDB 7 feature compatibility.
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["email"]
    restart: unless-stopped
    ports:
      - "8025:8025"

  authentication:
    build:
      context: ./backend
      dockerfile: authentication/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  testing:
    build:
      context: ./backend
      dockerfile: testing/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy

  ai:
    build:
      context: ./backend
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy

  notification:
    build:
      context: ./backend
      dockerfile: notification/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  content:
    build:
      context: ./backend
      dockerfile: content/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cloud:
    build:
      context: ./backend
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - authentication
      - testing
      - notification
      - content
      - cloud
      - worker
    ports:
      - "8000:8000"
    volumes:
      - ./gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_NOTIFICATION_ENABLED: ${NEXT_PUBLIC_NOTIFICATION_ENABLED}
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  qdrant_data:
