  websocket:
    build:
      context: ./backend
      dockerfile: ./websocket/Dockerfile
    container_name: doclib_websocket
    restart: always
    env_file:
      - .env
    ports:
      - "8200:8200"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws.rule=PathPrefix(`/message`) || PathPrefix(`/editor`)"
      - "traefik.http.services.ws.loadbalancer.server.port=8200"
    depends_on:
      - redis
    volumes:
      - ./backend/websocket/src:/app/src
      - ./backend/core:/app/core
      - ./backend/logs/websocket:/app/logs
    networks:
      - doclib_network

