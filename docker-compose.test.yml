services:
  authentication:
    environment:
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS},http://localhost:3002,http://127.0.0.1:3002"

  content:
    environment:
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS},http://localhost:3002,http://127.0.0.1:3002"

  cloud:
    environment:
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS},http://localhost:3002,http://127.0.0.1:3002"

  notification:
    environment:
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS},http://localhost:3002,http://127.0.0.1:3002"

  frontend_e2e_server:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: runner
    container_name: veriq_frontend_e2e_server
    restart: "no"
    ports:
      - 3002:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_NOTIFICATION_ENABLED: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 10s
      retries: 30
    networks:
      - veriq_network

  frontend_e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
    working_dir: /work
    command: ["./node_modules/.bin/playwright", "test"]
    network_mode: host
    ipc: host
    environment:
      E2E_BASE_URL: http://localhost:3002
      CI: "true"
      PLAYWRIGHT_OUTPUT_DIR: /tmp/veriq-playwright-results
    volumes:
      - ./frontend:/work
      - frontend_node_modules:/work/node_modules
      - ./test-results:/tmp/veriq-playwright-results
    depends_on:
      frontend_e2e_server:
        condition: service_healthy

  model_stub:
    image: veriq-ai
    pull_policy: never
    container_name: veriq_model_stub
    command: ["python", "/test-support/model_provider_stub.py"]
    restart: "no"
    volumes:
      - ./backend/ai/tests/model_provider_stub.py:/test-support/model_provider_stub.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/tags', timeout=5)"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks:
      - veriq_network

  ai:
    environment:
      LLM_MODEL: integration-model
      PRIMARY_MODEL_STYLE: ollama
      PRIMARY_MODEL_URL: http://model_stub:8000/api/chat
      PRIMARY_MODEL_HEALTH_URL: http://model_stub:8000/api/tags
      MODEL_TIMEOUT_SECONDS: 10
    depends_on:
      model_stub:
        condition: service_healthy

  testing:
    environment:
      TESTING_ALLOW_TEST_IDENTITY: "true"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS},http://localhost:3002,http://127.0.0.1:3002"
