global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: doclib-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - agentic_ai:8000
          - authentication:8000
          - cloud:8000
          - collaboration:8000
          - collection:8000
          - compilation:8000
          - content:8000
          - engagement:8000
          - humanity:8000
          - notification:8000
          - rag:8000
          - search:8000
          - websocket:8000
          - worker:8000

  - job_name: agentic-ai-harness
    metrics_path: /evaluate/metrics
    static_configs:
      - targets:
          - agentic_ai:8000
