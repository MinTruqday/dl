global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: veriq-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai:8000
          - authentication:8000
          - cloud:8000
          - content:8000
          - testing:8000
          - worker:8000

  - job_name: ai-harness
    metrics_path: /evaluate/metrics
    static_configs:
      - targets:
          - ai:8000
