server {
    listen 8000;
    client_max_body_size 110m;

    location /xac-thuc/ { proxy_pass http://authentication:8000; }
    location /quan-tri/ { proxy_pass http://authentication:8000; }
    location /kiem-thu/ {
        proxy_pass http://testing:8000;
        # Gemma 4 can take longer than nginx's default 60 seconds for a
        # structured Requirement proposal. Testing itself has a 90-second
        # provider timeout, so leave enough room for it to return a response.
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    # Avoid nginx redirecting the credentialed CORS preflight for the
    # notification root endpoint from /thong-bao to /thong-bao/.
    location = /thong-bao { proxy_pass http://notification:8000/thong-bao; }
    location /thong-bao/ { proxy_pass http://notification:8000; }
    location /tai-lieu/ { proxy_pass http://content:8000; }
    location /phien-ban/ { proxy_pass http://content:8000; }
    location /luu-tru/ { proxy_pass http://cloud:8000; }
    location /tai-len/ { proxy_pass http://cloud:8000; }
    location /thung-rac/ { proxy_pass http://cloud:8000; }
    location /thu-muc/ { proxy_pass http://cloud:8000; }
    location /tep-tin/ { proxy_pass http://cloud:8000; }
    location /phan-doan/ { proxy_pass http://cloud:8000; }
    location /tai-ve/ { proxy_pass http://cloud:8000; }
    location /xu-ly-nen/ { proxy_pass http://worker:8000; }

    location / { return 404; }
}
